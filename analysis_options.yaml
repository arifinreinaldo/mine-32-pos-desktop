# Mine32 POS analysis config. Strict-but-practical: catches real bugs without
# fighting the codegen output (generated files are excluded).
include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - "**/*.g.dart"
    - "**/*.drift.dart"
    - "build/**"
    - "lib/generated_plugin_registrant.dart"
  language:
    strict-casts: true
  errors:
    # json_serializable sometimes annotates fields in a way the analyzer flags.
    invalid_annotation_target: ignore

linter:
  rules:
    - always_declare_return_types
    - avoid_print
    - prefer_single_quotes
    - prefer_const_constructors
    - prefer_const_constructors_in_immutables
    - prefer_const_declarations
    - prefer_final_locals
    - unawaited_futures
    - directives_ordering
    - sort_child_properties_last
    - use_super_parameters
    - avoid_redundant_argument_values
    - unnecessary_lambdas
